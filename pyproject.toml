[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.13.0"
description = "JARVIS local-first desktop assistant foundation"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.141",
    "httpx>=0.28",
    "numpy>=2",
    "ollama>=0.6",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "PySide6>=6.10",
    "pygame-ce>=2.5",
    "sqlalchemy>=2.0",
    "structlog>=26.1",
    "uvicorn>=0.53",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4"]
memory = ["qdrant-client>=1.15,<2"]
browser = ["playwright>=1.50"]
vision = ["Pillow>=11"]
voice = [
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
